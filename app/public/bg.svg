<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noise"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
    <filter id="rough">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#f4f0e6"/>
  <g opacity="0.12" stroke="#6b7a99" stroke-width="0.5" filter="url(#rough)">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="650" x2="800" y2="650"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
    <line x1="50" y1="0" x2="50" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="350" y1="0" x2="350" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="650" y1="0" x2="650" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
  </g>
  <rect width="800" height="800" filter="url(#noise)" opacity="0.5"/>
  <rect x="8" y="8" width="784" height="784" fill="none" stroke="#8b7355" stroke-width="2" opacity="0.3" filter="url(#rough)"/>
</svg>
