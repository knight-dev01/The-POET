backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'media: add "{{path}}"'
    deleteMedia: 'media: remove "{{path}}"'

site_url: https://portfolio-xi-seven-8aw4xk7yfe.vercel.app
display_url: https://portfolio-xi-seven-8aw4xk7yfe.vercel.app
logo_url: ''

media_folder: "app/public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "app/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Updated Date", name: "updated", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Topics", name: "topics", widget: "list", field: { label: "Topic", name: "topic", widget: "string" } }
      - { label: "Keywords", name: "keywords", widget: "list", field: { label: "Keyword", name: "keyword", widget: "string" } }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, required: false }
      - { label: "External Source URL", name: "external", widget: "string", required: false, hint: "If this post originally lives elsewhere (Medium, Dev.to, etc)." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "app/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "projects/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Topics", name: "topics", widget: "list", field: { label: "Topic", name: "topic", widget: "string" } }
      - { label: "Keywords", name: "keywords", widget: "list", field: { label: "Keyword", name: "keyword", widget: "string" } }
      - { label: "Stack", name: "stack", widget: "list", field: { label: "Tech", name: "tech", widget: "string" } }
      - { label: "Repo URL", name: "repo", widget: "string", required: false }
      - { label: "Live URL", name: "live", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
