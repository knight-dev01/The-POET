<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="2" stitchTiles="stitch" result="fibers"/>
      <feColorMatrix in="fibers" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0.03 0" result="fiberTint"/>
      <feBlend in="SourceGraphic" in2="fiberTint" mode="multiply"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f5f1e8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#f5f1e8" filter="url(#fiber)"/>
  <rect width="400" height="400" fill="url(#vignette)"/>
  <rect width="400" height="400" filter="url(#paperNoise)"/>
</svg>
