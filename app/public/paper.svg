<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="5" seed="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" intercept="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.5" numOctaves="3" seed="11" stitchTiles="stitch" result="f"/>
      <feColorMatrix in="f" type="matrix"
        values="0 0 0 0 0.62  0 0 0 0 0.57  0 0 0 0 0.48  0 0 0 0.7 0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" intercept="0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="400" filter="url(#grain)"/>
  <rect width="400" height="400" filter="url(#fiber)"/>
  <ellipse cx="90" cy="120" rx="130" ry="95" fill="#8a7f6a" opacity="0.07"/>
  <ellipse cx="310" cy="290" rx="145" ry="110" fill="#7d7360" opacity="0.06"/>
  <ellipse cx="230" cy="60" rx="100" ry="70" fill="#938873" opacity="0.05"/>
</svg>
